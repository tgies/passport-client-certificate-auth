name: Publish Package to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating GitHub releases
      id-token: write  # needed for npm provenance and OIDC trusted publishers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

      - name: Validate package exports
        run: npx publint

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      # First publish: set NPM_TOKEN secret in repo settings.
      # Once the package exists on npm, configure OIDC trusted publishers
      # at https://www.npmjs.com/package/passport-client-certificate-auth/access
      # and remove the NPM_TOKEN secret — OIDC will handle auth via id-token.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
